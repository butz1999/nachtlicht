CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LED_STRIP=y
CONFIG_PULSE_IO=y
CONFIG_WS2812_STRIP_PULSE_IO=y
CONFIG_PULSE_IO_ESP32_RMT=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=n
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_WIFI=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_STA_AUTO_DHCPV4=n
CONFIG_LOG=y
CONFIG_WIFI_LOG_LEVEL_DBG=n

# zenoh-pico Zephyr module: TCP client with the threading support required by
# its Zephyr platform layer. No session is opened yet.
CONFIG_ZENOH_PICO=y
CONFIG_ZENOH_PICO_LINK_TCP=y
CONFIG_ZENOH_PICO_MULTI_THREAD=y
CONFIG_POSIX_API=y

# zenoh-pico creates session, transport and executor synchronization objects.
# Zephyr's POSIX defaults of five mutexes are insufficient for one session.
CONFIG_POSIX_THREAD_THREADS_MAX=8
CONFIG_MAX_PTHREAD_MUTEX_COUNT=16
CONFIG_MAX_PTHREAD_COND_COUNT=8
